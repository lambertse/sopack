[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sopack"
version = "0.1.0"
description = "Black-box Android .so encryptor / APK repackager (obfuscation)"
requires-python = ">=3.9"
dependencies = [
    # >=1.0 is a hard floor, not tidiness. LIEF places the appended segments, and 0.17.0 was
    # observed emitting a 4 KB-aligned LOAD when injecting a 1.7 MB arm64 library - output that
    # cannot load on 16 KB-page hardware, which the packer then refuses (_assert_16k_and_no_textrel).
    # 1.0.0 is verified clean on all three wbaes artifacts (target, thin helper, shared provider)
    # for that same library. See docs/TROUBLESHOOTING.md §16 KB.
    "lief>=1.0",
    # The config file parser. Everything except the input and output APK is configured in
    # YAML now (sopack/config.py), so this is a hard runtime requirement, not an extra.
    # Two build paths pre-stage sopack's dependencies so they need no network at run time -
    # docker/Dockerfile's system pip layer and the portable bundle's install.sh - and both
    # name their packages explicitly. Adding a dependency here means adding it there too.
    "pyyaml>=6",
]

[project.scripts]
sopack = "sopack.cli:main"

[tool.setuptools]
packages = ["sopack"]

[tool.setuptools.package-data]
sopack = ["stubs/*.bin", "stubs/*.json"]

[tool.pytest.ini_options]
# testpaths is NOT optional here, and it is the reason this section is dangerous to add without
# it. Declaring any [tool.pytest.ini_options] makes pyproject.toml the configfile, which sets
# rootdir to the repo root - and a bare `pytest` then walks the whole tree. Two vendored CPython
# stdlibs live under third_party/ (the O-MVLL plugin embeds a 3.10 interpreter and needs its
# Lib/), carrying ~1400 files named test_*.py between them. Collecting them is not merely slow:
# idlelib/idle_test/test_configdialog.py imports tkinter at module scope and ABORTS the
# interpreter, so `pytest` died before running a single one of ours.
testpaths = ["tests"]

# Belt and braces: testpaths only bounds the default run, so an explicit `pytest third_party/...`
# or a plugin that rescans would still walk in.
norecursedirs = [
    "third_party", "vendor", "artifacts", "out", "output", "build", "test_apks",
    ".git", "*.egg-info",
]

# `slow` marks the tests that shell out to clang+lld through O-MVLL. They skip themselves when
# the toolchain is absent, so this is a label for `-m "not slow"`, not a gate.
markers = ["slow: needs the NDK + O-MVLL toolchain and takes seconds, not milliseconds"]
